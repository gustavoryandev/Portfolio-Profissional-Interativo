<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Portfólio interativo de Gustavo" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <title>Gustavo Ryan | Portfólio</title>
    <script>
      // Set the saved palette before the first paint, including on a direct visit to /chat.
      let savedTheme;
      try { savedTheme = localStorage.getItem('theme'); } catch {}
      // Keep these aliases in sync with src/data/themes.js.
      const legacyThemeIds = {
        'obsidian-gold': 'midnight-pink',
        'grafite-coral': 'midnight-pink',
        'champagne-gold': 'ardosia-cobalto',
        'mint-frost': 'petroleo-gelo',
      };
      if (Object.hasOwn(legacyThemeIds, savedTheme)) savedTheme = legacyThemeIds[savedTheme];
      const theme = /^(light|dark|galo|galo-light|aurora|midnight-violet|midnight-pink|porcelain-indigo|ardosia-cobalto|petroleo-gelo)$/.test(savedTheme)
        ? savedTheme : 'dark';
      const root = document.documentElement;
      root.dataset.theme = theme;
      root.classList.toggle('dark', !['light', 'galo-light', 'porcelain-indigo', 'ardosia-cobalto', 'petroleo-gelo'].includes(theme));
      root.toggleAttribute('data-custom-theme', theme !== 'light' && theme !== 'dark');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
