<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Portfólio interativo de Gustavo" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <title>Gustavo Ryan | Portfólio</title>
    <script>
      // Set the saved palette before the first paint, including on a direct visit to /chat.
      let savedTheme;
      try { savedTheme = localStorage.getItem('theme'); } catch {}
      let savedDimension = 'lab';
      try { savedDimension = savedTheme === 'rick-morty-secret' ? 'corrupted' : localStorage.getItem('rick-morty-dimension'); } catch {}
      let beyondUnlocked = false;
      try { beyondUnlocked = localStorage.getItem('rick-morty-beyond-unlocked') === '1'; } catch {}
      // Keep these aliases in sync with src/data/themes.js.
      const legacyThemeIds = {
        'rick-morty-secret': 'rick-morty',
        'midnight-pink': 'la-casa-de-papel-dark',
        'obsidian-gold': 'la-casa-de-papel-dark',
        'grafite-coral': 'la-casa-de-papel-dark',
        'champagne-gold': 'ardosia-cobalto',
        'mint-frost': 'petroleo-gelo',
        'porcelain-indigo': 'papel-violeta',
      };
      if (Object.hasOwn(legacyThemeIds, savedTheme)) savedTheme = legacyThemeIds[savedTheme];
      const lightThemes = ['light', 'galo-light', 'papel-violeta', 'quartzo-framboesa', 'ardosia-cobalto', 'petroleo-gelo'];
      const darkThemes = ['rick-morty', 'dark', 'galo', 'aurora', 'midnight-violet', 'la-casa-de-papel-dark', 'cobalto-intenso', 'petroleo-eletrico', 'floresta-mineral'];
      const theme = lightThemes.includes(savedTheme) || darkThemes.includes(savedTheme) ? savedTheme : 'dark';
      const root = document.documentElement;
      root.dataset.theme = theme;
      // Match readRickDimension in src/data/rickDimensions.js.
      if (theme === 'rick-morty') {
        root.dataset.dimension = savedDimension === 'corrupted' ? 'corrupted'
          : beyondUnlocked && savedDimension === 'beyond-curve' ? 'beyond-curve' : 'lab';
      }
      root.classList.toggle('dark', darkThemes.includes(theme));
      root.toggleAttribute('data-custom-theme', theme !== 'light' && theme !== 'dark');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
